<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CheckMate — App Shell</title>
    <style>
      html,body{height:100%;margin:0}
      body{display:flex;flex-direction:column;font-family:Inter,Arial, sans-serif}
      header{padding:12px 16px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,0.06);}
      header h1{margin:0;font-size:16px}
      main{flex:1;display:flex;}
      iframe{flex:1;border:0;width:100%;height:100%}
      nav{height:68px;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:space-around;border-top:1px solid rgba(0,0,0,0.06)}
      .btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;cursor:pointer;color:#444;text-decoration:none}
    </style>
  </head>
  <body>
    <header>
      <h1>CheckMate — Unified Shell (single tab)</h1>
    </header>

    <main>
      <iframe id="app-frame" src="index.html" title="CheckMate app"></iframe>
    </main>

    <nav>
      <div class="btn" onclick="load('index.html')">📘<div style="font-size:12px">Learning</div></div>
      <div class="btn" onclick="load('habbit.html')">✅<div style="font-size:12px">Habits</div></div>
      <div class="btn" onclick="load('habbit.html#analytics')">📊<div style="font-size:12px">Analytics</div></div>
    </nav>

    <script>
      const frame = document.getElementById('app-frame');
      function load(path){
        // If same path, reload inside frame
        if(frame.src && frame.src.endsWith(path)) frame.contentWindow.location.reload();
        else frame.src = path;
      }

      // Intercept top-level nav links inside iframe to ensure they stay in shell
      // (only works same-origin; both files are local in the same folder)
      frame.addEventListener('load', () => {
        try{
          const doc = frame.contentDocument || frame.contentWindow.document;
          // find anchors that would open a new tab and remove target
          doc.querySelectorAll('a[target="_blank"]').forEach(a => a.removeAttribute('target'));
          // convert plain links to navigate the frame rather than top-level
          doc.querySelectorAll('a[href]').forEach(a=>{
            a.addEventListener('click', (e)=>{
              const href = a.getAttribute('href');
              if(!href) return;
              // allow anchors within same document
              if(href.startsWith('#')) return;
              e.preventDefault();
              // load into frame
              frame.src = href;
            });
          });
        }catch(e){
          // cross-origin or other error — ignore
        }
      });
    </script>
  </body>
</html>
