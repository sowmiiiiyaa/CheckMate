<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiSGFiaXQgVHJhY2tlciIsInNob3J0X25hbWUiOiJIYWJpdHMiLCJzdGFydF91cmwiOiIvIiwiZGlzcGxheSI6InN0YW5kYWxvbmUifQ==">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5e6d3 0%, #fef5e7 50%, #e8f5e9 100%);
            min-height: 100vh;
            padding: 16px 16px 80px;
            color: #5d4e37;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 200, 150, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(200, 230, 200, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 220, 180, 0.2) 0%, transparent 50%);
            animation: wave 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes wave {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 5%) rotate(5deg); }
            50% { transform: translate(-5%, 5%) rotate(-5deg); }
            75% { transform: translate(5%, -5%) rotate(3deg); }
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #8b6f47 0%, #a0826d 50%, #6b5d4f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            text-shadow: 0 2px 4px rgba(139, 111, 71, 0.1);
        }

        .week-label {
            text-align: center;
            font-size: 14px;
            color: #8b7355;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .card {
            background: rgba(255, 252, 245, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(139, 111, 71, 0.1);
            box-shadow: 
                0 4px 20px rgba(139, 111, 71, 0.08),
                0 1px 3px rgba(139, 111, 71, 0.05);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 200, 150, 0.3), transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            z-index: -1;
        }

        /* Habits Page Specific */
        .habits-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .habit-row {
            display: grid;
            /* Two-column layout: name (left) and checks+actions (right) */
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 16px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 250, 240, 0.9));
            border-radius: 16px;
            border: 1px solid rgba(139, 111, 71, 0.1);
            box-shadow: 0 2px 8px rgba(139, 111, 71, 0.06);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .habit-row::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent-color);
            border-radius: 4px 0 0 4px;
        }

        .habit-row:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 111, 71, 0.12);
        }

        .habit-row.deleting {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideOut {
            to {
                transform: translateX(-100%);
                opacity: 0;
                margin-bottom: 0;
                padding: 0;
                height: 0;
            }
        }

        .habit-name-col {
            font-weight: 600;
            font-size: 16px;
            color: #5d4e37;
            text-align: left;
            /* ensure name stays in the left column */
            grid-column: 1 / 2;
        }

        .habit-checks-col {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: nowrap;
            /* place checks in the right column */
            grid-column: 2 / 3;
        }

        .day-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 36px;
        }

        .day-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a0826d;
        }

        .check-circle {
            width: 32px;
            height: 32px;
            border: 2.5px solid #d4b896;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            position: relative;
            z-index: 2;
            pointer-events: auto;
        }

        .check-circle:hover {
            border-color: #8b6f47;
            transform: scale(1.15);
            box-shadow: 0 2px 8px rgba(139, 111, 71, 0.2);
        }

        .check-circle.checked {
            background: var(--accent-color);
            border-color: rgba(0,0,0,0.08);
        }

        /* Use a visible checkmark with stronger contrast */
        .check-circle.checked::after {
            content: '✔';
            color: rgba(0,0,0,0.9);
            font-size: 16px;
            line-height: 1;
            font-weight: 700;
        }

        /* Ensure label contrast */
        .day-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5d4e37;
        }

        .habit-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .habit-stats {
            font-size: 13px;
            color: #8b7355;
            font-weight: 500;
        }

        .delete-btn {
            background: rgba(205, 92, 92, 0.1);
            border: 1px solid rgba(205, 92, 92, 0.3);
            color: #cd5c5c;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: rgba(205, 92, 92, 0.2);
            border-color: rgba(205, 92, 92, 0.5);
        }

        .add-section {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .add-input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 2px solid rgba(139, 111, 71, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #5d4e37;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .add-input:focus {
            outline: none;
            border-color: #8b6f47;
            box-shadow: 0 0 0 3px rgba(139, 111, 71, 0.1);
        }

        .add-input::placeholder {
            color: #b8a89a;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b6f47, #a0826d);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(139, 111, 71, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 111, 71, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Analytics & Home - Keep original purple gradient style */
        #home-page, #analytics-page {
            background: none;
        }

        #home-page .card, #analytics-page .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #home-page h1, #analytics-page h1 {
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            background: none;
            -webkit-text-fill-color: #fff;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #fff;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            color: #fff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
            border-radius: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin: 16px 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
        }

        .calendar-day.active {
            background: rgba(52, 211, 153, 0.8);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 252, 245, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(139, 111, 71, 0.15);
            box-shadow: 0 -4px 20px rgba(139, 111, 71, 0.08);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #a0826d;
            text-decoration: none;
            font-size: 13px;
            padding: 8px 24px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 12px;
            font-weight: 500;
        }

        .nav-item.active {
            color: #5d4e37;
            background: rgba(139, 111, 71, 0.1);
            border-bottom: 3px solid #8b6f47;
        }

        .nav-icon {
            font-size: 22px;
        }

        /* Color accents for habits */
        .habit-row:nth-child(1) { --accent-color: #FFB399; }
        .habit-row:nth-child(2) { --accent-color: #FF9999; }
        .habit-row:nth-child(3) { --accent-color: #98C1D9; }
        .habit-row:nth-child(4) { --accent-color: #C8B4DC; }
        .habit-row:nth-child(5) { --accent-color: #98D9C0; }
        .habit-row:nth-child(6) { --accent-color: #FFDAB9; }
        .habit-row:nth-child(7) { --accent-color: #E6B8AF; }
        .habit-row:nth-child(8) { --accent-color: #B8D4E6; }

        @media (max-width: 768px) {
            .habit-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .habit-actions {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }
        }

        @media (max-width: 500px) {
            .habit-checks-col {
                gap: 8px;
            }

            .check-circle {
                width: 28px;
                height: 28px;
            }

            .day-label {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="status-toast" style="position:fixed;top:16px;right:16px;z-index:9999;display:none;padding:10px 14px;border-radius:8px;background:rgba(0,0,0,0.75);color:#fff;font-weight:600;"></div>
    <!-- Home page removed (unused/broken). Habits page will be primary. -->

    <div id="habits-page" class="page active">
        <div class="habits-container">
            <h1>HABIT TRACKER</h1>
            <div class="week-label" id="week-label"></div>
            <div class="card">
                <div id="manage-habits-list"></div>
                <div class="add-section">
                    <input type="text" id="habit-input" class="add-input" placeholder="New habit...">
                    <button class="btn" onclick="addHabit('habits')">+ Add Habit</button>
                </div>
            </div>
        </div>
    </div>

    <div id="analytics-page" class="page">
        <h1>📊 Analytics</h1>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="streak-value">0</div>
                <div class="stat-label">Day Streak</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-value">0%</div>
                <div class="stat-label">Avg Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="best-value">0%</div>
                <div class="stat-label">Best Week</div>
            </div>
        </div>
        <div class="card">
            <h3 style="margin-bottom: 12px; color: #fff;">Weekly Trend</h3>
            <canvas id="sparkline" width="400" height="100"></canvas>
        </div>
        <div class="card">
            <h3 style="margin-bottom: 12px; color: #fff;">Completion Rate</h3>
            <canvas id="bars" width="400" height="150"></canvas>
        </div>
        <div class="card">
            <h3 style="margin-bottom: 12px; color: #fff;">Last 28 Days</h3>
            <div class="calendar-grid" id="calendar"></div>
        </div>
        <button class="btn" onclick="exportCSV()" style="width: 100%; margin-top: 16px;">Export CSV</button>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" href="index.html" title="Open Learning Tracker">
            <div class="nav-icon">📖</div>
            <div>Learning</div>
        </a>
        <div class="nav-item active" onclick="switchPage('habits', this)">
            <div class="nav-icon">✅</div>
            <div>Habits</div>
        </div>
        <div class="nav-item" onclick="switchPage('analytics', this)">
            <div class="nav-icon">📊</div>
            <div>Analytics</div>
        </div>
    </nav>

    <script>
        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        
        function getHabits() {
            const data = localStorage.getItem('habits');
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    const cleaned = sanitizeHabits(parsed || []);
                    // if cleaned differs, persist sanitized copy
                    try { localStorage.setItem('habits', JSON.stringify(cleaned)); } catch(e){}
                    return cleaned;
                } catch (err) {
                    console.warn('Failed to parse stored habits, resetting storage.', err);
                    try { localStorage.removeItem('habits'); } catch(e){}
                }
            }
            // fallback to in-memory store if localStorage unavailable
            if (window.__HABITS_FALLBACK) {
                try { return JSON.parse(window.__HABITS_FALLBACK); } catch (e) { return []; }
            }
            return [];
        }

        function sanitizeHabits(habits) {
            if (!Array.isArray(habits)) return [];
            const cleaned = habits.reduce((acc, h) => {
                if (!h || typeof h !== 'object') return acc;
                const id = h.id || Date.now() + Math.floor(Math.random()*1000);
                const name = (typeof h.name === 'string' && h.name.trim()) ? h.name.trim() : 'Untitled';
                let checks = Array.isArray(h.checks) ? h.checks.slice(0,7) : [];
                if (checks.length < 7) {
                    const filled = Array(7).fill(false);
                    for (let i = 0; i < checks.length; i++) filled[i] = !!checks[i];
                    checks = filled;
                } else {
                    checks = checks.map(c => !!c);
                }
                const createdAt = h.createdAt || new Date().toISOString();
                acc.push({ id, name, checks, createdAt });
                return acc;
            }, []);
            return cleaned;
        }

        function saveHabits(habits) {
            try {
                localStorage.setItem('habits', JSON.stringify(habits));
            } catch (err) {
                // localStorage may be unavailable (private mode, quota). Fallback to in-memory store.
                console.warn('localStorage unavailable, using in-memory fallback', err);
                try {
                    window.__HABITS_FALLBACK = JSON.stringify(habits);
                } catch (e) {
                    console.error('Failed to save fallback habits', e);
                }
            }
        }

        // (duplicate simple save removed) -- using resilient saveHabits above

        function getWeekLabel() {
            const today = new Date();
            // Compute Monday (start of ISO week) and Sunday reliably
            const day = today.getDay(); // 0 (Sun) - 6 (Sat)
            const diffToMonday = day === 0 ? -6 : 1 - day; // if Sunday, go back 6 days
            const monday = new Date(today);
            monday.setDate(today.getDate() + diffToMonday);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            
            const options = { month: 'short', day: 'numeric' };
            return `Week of ${monday.toLocaleDateString('en-US', options)} - ${sunday.toLocaleDateString('en-US', options)}`;
        }

        function addHabit(page) {
            const inputId = page === 'home' ? 'home-habit-input' : 'habit-input';
            const input = document.getElementById(inputId);
            if (!input) {
                alert('Input element not found.');
                return;
            }
            const name = input.value.trim();
            if (!name) {
                showStatus('Enter a habit name', true);
                input.focus();
                return;
            }

            try {
                const habits = getHabits();
                const newHabit = {
                    id: Date.now(),
                    name: name,
                    checks: Array(7).fill(false),
                    createdAt: new Date().toISOString()
                };
                habits.push(newHabit);
                saveHabits(habits);
                input.value = '';
                console.log('Added habit', newHabit);
                showStatus('Habit added');
                renderHabits();
                renderAnalytics();
            } catch (err) {
                console.error('Failed to add habit', err);
                const msg = err && err.message ? err.message : String(err);
                showStatus('Failed to add habit: ' + msg, true);
                try {
                    localStorage.setItem('habits_lastError', err && err.stack ? err.stack : msg);
                } catch (e) {
                    // ignore
                }
            }
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-toast');
            if (!el) return;
            el.textContent = msg;
            el.style.background = isError ? 'rgba(205,92,92,0.95)' : 'rgba(0,0,0,0.75)';
            el.style.display = 'block';
            clearTimeout(el._hideTimeout);
            el._hideTimeout = setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        function toggleCheck(habitId, dayIndex) {
            const habits = getHabits();
            const habit = habits.find(h => h.id == habitId);
            if (habit) {
                habit.checks[dayIndex] = !habit.checks[dayIndex];
                saveHabits(habits);
                renderHabits();
                renderAnalytics();
            }
        }

        function deleteHabit(habitId) {
            if (!confirm('Delete this habit?')) return;
            
            const element = document.querySelector(`[data-habit-id="${habitId}"]`);
            if (element) {
                element.classList.add('deleting');
                setTimeout(() => {
                    const habits = getHabits();
                    const filtered = habits.filter(h => h.id != habitId);
                    saveHabits(filtered);
                    renderHabits();
                    renderAnalytics();
                }, 300);
            }
        }

        function renderHabits() {
            const habits = getHabits();
            document.getElementById('week-label').textContent = getWeekLabel();
            
            // Render Habits page
            const manageContainer = document.getElementById('manage-habits-list');
            let manageHtml = '';
            
            habits.forEach((habit) => {
                const completed = habit.checks.filter(c => c).length;
                const total = habit.checks.length;
                const percentage = Math.round((completed / total) * 100);

                manageHtml += `
                    <div class="habit-row" data-habit-id="${habit.id}">
                        <div class="habit-name-col">${habit.name}</div>
                        <div class="habit-checks-col">
                            ${habit.checks.map((checked, i) => `
                                <div class="day-group">
                                     <div class="check-circle ${checked ? 'checked' : ''}" 
                                         onclick="toggleCheck('${habit.id}', ${i})"></div>
                                    <div class="day-label">${days[i]}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="habit-actions">
                            <div class="habit-stats">${completed}/${total} ✓${percentage}%</div>
                            <button class="delete-btn" onclick="deleteHabit('${habit.id}')">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });

            if (habits.length === 0) {
                manageHtml = '<div style="text-align: center; padding: 40px; color: #a0826d;">No habits yet. Add your first habit below!</div>';
            }

            manageContainer.innerHTML = manageHtml;

            // Render Home page (simplified view) — removed when Home section is not present
            const homeContainer = document.getElementById('habits-list');
            if (homeContainer) {
                let homeHtml = '';
                habits.forEach((habit, idx) => {
                    const completed = habit.checks.filter(c => c).length;
                    const total = habit.checks.length;
                    const percentage = Math.round((completed / total) * 100);

                    homeHtml += `
                        <div class="card" style="background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);">
                            <div style="font-weight: 600; font-size: 16px; margin-bottom: 12px; color: #fff;">${habit.name}</div>
                            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                                ${habit.checks.map((checked, i) => `
                                    <div class="check-circle ${checked ? 'checked' : ''}" 
                                         style="width: 28px; height: 28px; border-color: rgba(255,255,255,0.5);"
                                         onclick="toggleCheck(${habit.id}, ${i})">
                                        ${checked ? '<span style="color: #fff; font-size: 16px;">●</span>' : ''}
                                    </div>
                                `).join('')}
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div style="font-size: 14px; color: rgba(255,255,255,0.9);">
                                    <span>${completed}/${total}</span>
                                    <span style="margin-left: 12px;">${percentage}%</span>
                                </div>
                                <button class="delete-btn" onclick="deleteHabit(${habit.id})" style="background: rgba(255, 59, 48, 0.8); border: none; color: #fff;">🗑️</button>
                            </div>
                        </div>
                    `;
                });

                if (habits.length === 0) {
                    homeHtml = '<div class="card">No habits yet. Add your first habit above!</div>';
                }

                homeContainer.innerHTML = homeHtml;
            }
        }

        function renderAnalytics() {
            const habits = getHabits();
            
            let currentStreak = 0;
            let weeklyPercentages = [];
            
            if (habits.length > 0) {
                for (let week = 0; week < 4; week++) {
                    let total = 0;
                    let completed = 0;
                    habits.forEach(habit => {
                        if (week === 0) {
                            total += habit.checks.length;
                            completed += habit.checks.filter(c => c).length;
                        }
                    });
                    if (total > 0) {
                        weeklyPercentages.push(Math.round((completed / total) * 100));
                    }
                }

                if (habits.length > 0 && habits[0].checks) {
                    for (let i = habits[0].checks.length - 1; i >= 0; i--) {
                        const dayComplete = habits.every(h => h.checks[i]);
                        if (dayComplete) currentStreak++;
                        else break;
                    }
                }
            }

            const avgWeek = weeklyPercentages.length > 0 
                ? Math.round(weeklyPercentages.reduce((a,b) => a+b, 0) / weeklyPercentages.length) 
                : 0;
            const bestWeek = weeklyPercentages.length > 0 
                ? Math.max(...weeklyPercentages) 
                : 0;

            document.getElementById('streak-value').textContent = currentStreak;
            document.getElementById('avg-value').textContent = avgWeek + '%';
            document.getElementById('best-value').textContent = bestWeek + '%';

            const sparkCanvas = document.getElementById('sparkline');
            const sparkCtx = sparkCanvas.getContext('2d');
            sparkCtx.clearRect(0, 0, sparkCanvas.width, sparkCanvas.height);
            
            if (weeklyPercentages.length > 1) {
                sparkCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                sparkCtx.lineWidth = 3;
                sparkCtx.beginPath();
                weeklyPercentages.forEach((val, i) => {
                    const x = (i / (weeklyPercentages.length - 1)) * sparkCanvas.width;
                    const y = sparkCanvas.height - (val / 100 * sparkCanvas.height);
                    if (i === 0) sparkCtx.moveTo(x, y);
                    else sparkCtx.lineTo(x, y);
                });
                sparkCtx.stroke();
            }

            const barCanvas = document.getElementById('bars');
            const barCtx = barCanvas.getContext('2d');
            barCtx.clearRect(0, 0, barCanvas.width, barCanvas.height);
            
            const barWidth = barCanvas.width / weeklyPercentages.length;
            weeklyPercentages.forEach((val, i) => {
                const height = (val / 100) * barCanvas.height;
                barCtx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                barCtx.fillRect(i * barWidth + 5, barCanvas.height - height, barWidth - 10, height);
                barCtx.fillStyle = '#fff';
                barCtx.font = '12px Inter';
                barCtx.fillText(val + '%', i * barWidth + barWidth/2 - 15, barCanvas.height - height - 5);
            });

            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            for (let i = 0; i < 28; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day';
                if (habits.length > 0 && Math.random() > 0.5) {
                    day.classList.add('active');
                }
                calendar.appendChild(day);
            }
        }

        function exportCSV() {
            const habits = getHabits();
            let csv = 'Habit,Mon,Tue,Wed,Thu,Fri,Sat,Sun,Completion\n';
            habits.forEach(habit => {
                const checks = habit.checks.map(c => c ? '✓' : '✗').join(',');
                const pct = Math.round((habit.checks.filter(c => c).length / habit.checks.length) * 100);
                csv += `${habit.name},${checks},${pct}%\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'habits.csv';
            a.click();
        }

        function switchPage(page, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            const pageEl = document.getElementById(page + '-page');
            if (pageEl) pageEl.classList.add('active');
            if (el) el.classList.add('active');

            if (page === 'analytics') {
                renderAnalytics();
            }
        }

        document.getElementById('habit-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addHabit('habits');
        });

        // Home input removed; no event listener required.

        // Start with an empty view — render existing user-saved habits only
        renderHabits();
        renderAnalytics();
    </script>
</body>
</html>
